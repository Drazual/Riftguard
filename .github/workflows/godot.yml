name: Godot build

# Builds the Godot version of the game for Windows on every push to main that changes godot/,
# wraps it in an installer (installer/riftguard.iss) that adds desktop and Start menu shortcuts,
# and publishes both as a GitHub release tagged godot-v<version>. The game checks these releases
# on launch and updates itself (see godot/scripts/core/updater.gd).
on:
  push:
    branches: [main]
    paths: ['godot/**', 'installer/**', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT: 4.7.2

jobs:
  windows:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and the export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT}-stable_export_templates.tpz"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q templates.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT}.stable/
      # Each build gets a higher version (major.minor from project.godot, patch = run number)
      # so installed copies see it as an update.
      - name: Set build version
        id: version
        run: |
          MM="$(grep -oP '^config/version="\K[0-9]+\.[0-9]+' godot/project.godot)"
          V="$MM.${{ github.run_number }}"
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" godot/project.godot
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Import
        run: godot --headless --path godot --import 2>&1 | tee import.log; ! grep -q "SCRIPT ERROR" import.log
      # A short headless run with every hero, to catch script errors before shipping.
      - name: Test run
        run: timeout 300 godot --headless --path godot res://tests/sim.tscn -- verdant 3 2>&1 | tee sim.log; grep -q "SIM DONE" sim.log && ! grep -q "SCRIPT ERROR" sim.log
      - name: Export
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-release "Windows" build/Riftguard.exe
          test -s godot/build/Riftguard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: riftguard-exe
          path: godot/build/Riftguard.exe

  # Inno Setup only runs on Windows, so the installer is built in its own job from the exported exe.
  installer:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riftguard-exe
          path: godot/build
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc "/DAppVersion=${{ needs.windows.outputs.version }}" installer\riftguard.iss
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path godot\build\Riftguard-setup.exe)) { exit 1 }
      - name: Write release notes
        shell: bash
        run: |
          {
            echo "Download **Riftguard-setup.exe** and run it. It installs the game with a desktop and Start menu shortcut, no admin rights needed."
            echo
            echo "Or download **Riftguard.exe** to play without installing; it adds a desktop shortcut the first time it runs."
            echo
            echo "Either way the game updates itself when you open it. This is the Godot version of the game. Built from ${{ github.sha }}."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-v${{ needs.windows.outputs.version }}
          name: Riftguard ${{ needs.windows.outputs.version }} (Godot)
          body_path: release-notes.md
          make_latest: true
          files: |
            godot/build/Riftguard-setup.exe
            godot/build/Riftguard.exe
