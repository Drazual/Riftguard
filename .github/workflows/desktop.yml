name: Desktop build

# Builds the old Electron Windows app and publishes it as a GitHub release.
# The game now ships as the Godot build (godot.yml), so this only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Each build gets a higher version (major.minor from package.json, patch = run number)
      # so installed copies see it as an update.
      - name: Set build version
        id: version
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}"
          npm pkg set version="$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm run dist:win
      # Release notes: download instructions plus the newest section of CHANGELOG.md.
      - name: Write release notes
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          {
            echo "Download **Riftguard-$V-setup.exe** to install the game. The installed game updates itself when you open it."
            echo "**Riftguard-$V-portable.exe** plays without installing, but does not update itself."
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md). Built from ${{ github.sha }}."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: v${{ steps.version.outputs.version }}
          name: Riftguard ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
            release/*-portable.exe
